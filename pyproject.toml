[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gog-achievements-py"
version = "1.0.0"
description = "Manage GOG Galaxy achievements"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gog-achievements = "gog_achievements.cli:main"

[tool.setuptools.packages.find]
include = ["gog_achievements*"]

[tool.setuptools.package-data]
gog_achievements = ["gog_client_credentials.json"]